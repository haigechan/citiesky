<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big & Easy Animals Coloring Book - By Haige Chan</title>
    <style>
        /* 1. 基础背景与字体 - 完全对齐动物绘本 */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. 顶端返回链接 */
        .back-link {
            margin-top: 20px;
            color: #aaaaaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #ffffff; }

        /* 3. 封面图容器 - 修改为与动物绘本一致的大小 */
        .cover-container {
            margin: 30px 0;
            width: 80%;
            max-width: 300px; /* 图1动物绘本的标准宽度 */
        }
        .cover-img {
            width: 100%;
            border-radius: 24px; /* 大圆角 */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: block;
        }

        /* 4. 标题 */
        h1 {
            font-size: 24px;
            margin: 10px 20px 30px 20px;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
        }

        /* 5. 按钮组样式 - 颜色与间距对齐图1 */
        .btn-group {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            color: white;
            transition: transform 0.2s, filter 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:active { transform: scale(0.96); }
        .btn i { margin-right: 12px; font-size: 20px; font-style: normal; }

        .btn-amazon { background-color: #FF9900; }
        .btn-video  { background-color: #eb4d4b; }
        .btn-audio  { background-color: #6c5ce7; }

        /* 6. 展开内容样式 */
        .hidden-box { 
            display: none;
            margin-top: 10px; 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 20px; 
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        
        audio { width: 100%; margin-bottom: 15px; }

        .dl-trigger {
            background: #6c5ce7;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            display: inline-block;
        }
        .status-msg { font-size: 12px; color: #888; margin-top: 10px; }

        footer {
            margin-top: auto;
            padding: 40px 0 20px 0;
            color: #444;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <a href="../" class="back-link">← Back to By Haige Chan's Library</a>

    <div class="cover-container">
        <img src="cover.jpg" class="cover-img" alt="Animal Coloring Book Cover">
    </div>

    <h1>Big & Easy Animals Coloring Book</h1>

    <div class="btn-group">
        <a href="https://www.amazon.com/dp/B0GVYGDSNV" class="btn btn-amazon" target="_blank">
            <i>🛒</i> Buy on Amazon
        </a>

        <a href="https://www.youtube.com/shorts/9wV7O0AK8qI" class="btn btn-video" target="_blank">
            <i>📺</i> Watch Trailer
        </a>

        <button class="btn btn-audio" onclick="toggleBox('audio-box')">
            <i>🎧</i> Listen & Download
        </button>

        <div id="audio-box" class="hidden-box">
            <audio id="audioPlayer" controls src="audio.mp3"></audio>
           
            <div style="text-align: center;">
                <button id="downloadBtn" class="dl-trigger" onclick="handleDownload('audio.mp3')">
                    📥 Download MP3
                </button>
                <p id="dlStatus" class="status-msg"></p>
            </div>
        </div>
    </div>

    <footer>
        © By Haige Chan
    </footer>

    <script>
        // 切换显示逻辑
        function toggleBox(id) {
            const box = document.getElementById(id);
            const isVisible = box.style.display === 'block';
            // 关闭其他已打开的框
            document.querySelectorAll('.hidden-box').forEach(b => b.style.display = 'none');
            box.style.display = isVisible ? 'none' : 'block';
        }

        // 下载逻辑
        async function handleDownload(url) {
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('dlStatus');
            try {
                btn.innerText = "⏳ Processing...";
                const response = await fetch(url);
                if (!response.ok) throw new Error();
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = "Fruit_Coloring_Book_Audio.mp3";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
                btn.innerText = "📥 Download MP3";
                status.innerText = "Download started!";
            } catch (err) {
                btn.innerText = "📥 Manual Save";
                status.innerHTML = "<strong>Environment limited.</strong><br>Long-press player and select 'Save audio'.";
            }
        }
    </script>
</body>
</html>
