<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Animal Coloring Book - By Haige Chan</title>
    <style>
        /* 1. 基础背景与字体 */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. 返回链接 */
        .back-link {
            margin-top: 20px;
            color: #aaaaaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #ffffff; }

        /* 3. 封面图容器 */
        .cover-container {
            margin: 30px 0;
            width: 80%;
            max-width: 300px;
        }
        .cover-img {
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: block;
        }

        /* 4. 标题 */
        h1 {
            font-size: 24px;
            margin: 10px 20px 30px 20px;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
        }

        /* 5. 按钮组 */
        .btn-group {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            color: white;
            transition: transform 0.2s, filter 0.2s;
            line-height: 1; /* 统一行高，防止图标撑开容器 */
        }
        .btn:active { transform: scale(0.96); }

        /* 核心修正：取消 i 标签的斜体，并进行垂直对齐微调 */
        .btn i { 
            margin-right: 12px; 
            font-size: 22px; 
            font-style: normal; /* 关键：强制图标不倾斜 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-1px); /* 微调：根据视觉手动修正 Emoji 的重心偏移 */
        }

        .btn-amazon { background-color: #ff9900; }
        .btn-video  { background-color: #f85959; }
        .btn-audio  { background-color: #7d67ff; }
        .btn-maze   { background-color: #28a745; }

        /* 6. 页脚 */
        footer {
            margin-top: auto;
            padding: 40px 0 20px 0;
            color: #444;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <a href="../" class="back-link">← Back to By Haige Chan's Library</a>

    <div class="cover-container">
        <img src="cover.jpg" class="cover-img" alt="Animal Coloring Book Cover">
    </div>

    <h1>My First Animal Coloring Book</h1>

    <div class="btn-group">
        <a href="https://www.amazon.com/dp/B0GZB44N42" class="btn btn-amazon"><i>🛒</i> Buy on Amazon</a>
        <a href="您的YouTube链接" class="btn btn-video"><i>📺</i> Watch Trailer</a>
        <a href="audio.mp3" class="btn btn-audio"><i>🎧</i> Listen & Download</a>
        <a href="maze-answer.jpg" class="btn btn-maze"><i>🧩</i> View Maze Answer</a>
    </div>

    <footer>
        © By Haige Chan
    </footer>

</body>
</html>
